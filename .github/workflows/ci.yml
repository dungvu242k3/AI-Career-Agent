name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: be/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r be/requirements-dev.txt

      - name: Run backend and AI tests
        run: python -m pytest -q

      - name: Verify explicit SQLite migration command
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-migration.db
          DB_PATH: ${{ runner.temp }}/careerpilot-ci-migration.db
        run: python -m be.db.migrate

  auth-typecheck:
    name: Auth service typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: auth-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: auth-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Auth tests and production build
        run: npm test

  frontend-build:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build production bundle
        run: npm run build

  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit Python runtime and development dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip_audit -r be/requirements.txt --strict
          python -m pip_audit -r be/requirements-dev.txt --strict

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit Auth service dependency lockfile
        working-directory: auth-service
        run: npm audit --package-lock-only --audit-level=high

      - name: Audit frontend dependency lockfile
        working-directory: fe
        run: npm audit --package-lock-only --audit-level=high

  docker-build:
    name: Build container images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            file: be/Dockerfile
          - name: auth
            context: auth-service
            file: ./Dockerfile
          - name: frontend
            context: fe
            file: ./Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: careerpilot/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
